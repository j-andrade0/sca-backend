name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    # Real MySQL: builds the image and brings the stack up through docker-compose.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create backend/.env from the example
        run: |
          cp backend/.env.example backend/.env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci-password/; s/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=ci-signing-key/" backend/.env
          printf "SEED_ADMIN_USER=1000\nSEED_ADMIN_PASSWORD=ci-admin-password\n" >> backend/.env
      - name: Start the stack
        run: docker compose --env-file backend/.env up -d --build --wait --wait-timeout 180
      - name: Smoke test (docs, admin login, authorization)
        run: |
          B=http://localhost:3000
          J='Content-Type: application/json'
          curl -fsS -o /dev/null $B/doc/
          ADMIN=$(curl -fsS -X POST $B/usuarioLogin -H "$J" -d '{"usuario":1000,"senha":"ci-admin-password"}' | jq -r .jwtToken)
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/unidade)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/unidade -H "Authentication: $ADMIN")" = "200"
          curl -fsS -o /dev/null -X POST $B/usuario -H "$J" -H "Authentication: $ADMIN" -d '{"usuario":2000,"senha":"pw-12345","nivel_acesso":1,"flag":true}'
          USER=$(curl -fsS -X POST $B/usuarioLogin -H "$J" -d '{"usuario":2000,"senha":"pw-12345"}' | jq -r .jwtToken)
          # the level comes from the token, so the legacy access-level header has no effect
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/unidade -H "Authentication: $USER" -H 'access-level: 99')" = "403"
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file backend/.env logs
