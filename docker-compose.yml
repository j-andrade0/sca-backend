version: "3.8"

services:
  sca:
    image: 123pedrosilva123/sca-backend:1.2.0
    container_name: sca-backend
    environment:
      DB_NAME: sca
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in backend/.env}
      PORT: 3000
    network_mode: "host"
    ports:
      - "3000:3000"

  mysql:
    image: mysql:8.0
    container_name: sca-backend-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sca
    network_mode: "host"
    ports:
      - "3306:3306"
